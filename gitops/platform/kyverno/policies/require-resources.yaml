# CPU and memory requests let the scheduler place pods sensibly; a memory limit
# stops one leaky service from taking the node down. (No CPU limits on purpose:
# they throttle bursts that would otherwise use idle CPU.)
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-requests-and-memory-limits
  annotations:
    policies.kyverno.io/title: Require requests and memory limits
    policies.kyverno.io/severity: medium
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: false   # admission only; no background scans on a laptop
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [shopflow-local, shopflow-dev, shopflow-prod]
  validations:
    - expression: >-
        object.spec.containers.all(c,
          has(c.resources) &&
          has(c.resources.requests) && 'cpu' in c.resources.requests && 'memory' in c.resources.requests &&
          has(c.resources.limits) && 'memory' in c.resources.limits)
      message: Every container needs CPU and memory requests and a memory limit.
