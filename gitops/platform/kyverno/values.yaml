# Small footprint for a laptop: only the admission controller, which is what
# enforces the policies. Background scans and reports add constant API load.
admissionController:
  replicas: 1
  container:
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 384Mi }
backgroundController:
  enabled: false
cleanupController:
  enabled: false
reportsController:
  enabled: false
