# Velero backs up the ShopFlow namespace, including the Postgres volume
# (file-system backup with the node agent), to S3-compatible storage. Locally
# that's SeaweedFS; on Azure it would be a Blob container with the Azure plugin.
initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.11.0
    volumeMounts:
      - { mountPath: /target, name: plugins }
configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: velero
      config:
        region: local
        s3ForcePathStyle: "true"
        s3Url: http://s3.velero:8333
  volumeSnapshotLocation: []
  defaultVolumesToFsBackup: true
credentials:
  useSecret: true
  secretContents:
    cloud: |
      [default]
      aws_access_key_id=velero
      aws_secret_access_key=velero-local-only
snapshotsEnabled: false
deployNodeAgent: true
# The CRD-upgrade hook uses a bitnami/kubectl image that is no longer on
# Docker Hub; Helm installs the CRDs from the chart itself on first install.
upgradeCRDs: false
resources:
  requests: { cpu: 20m, memory: 64Mi }
  limits: { memory: 512Mi }
