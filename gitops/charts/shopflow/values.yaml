# Defaults shared by every environment. envs/<env>/values.yaml overrides them.

environment: dev

image:
  registry: acrshopflow0q6q39.azurecr.io
  # Set per environment by the app pipeline: the commit it built and scanned.
  tag: ""

# Service Bus messaging: order-service publishes OrderCreated, payment- and
# notification-service consume. Off, orders are saved as PENDING_PAYMENT and
# the two consumers aren't deployed (used on small laptops, see envs/local).
messaging:
  enabled: true

# Load balancer in front of the frontend. internal: true gives it a private IP
# in the VNet instead of a public one.
publicEndpoint:
  enabled: true
  internal: false

# Sized so dev, prod and Argo CD share one 2-vCPU node, where AKS's own system
# pods already reserve about 70% of the CPU. Requests are only what the
# scheduler sets aside; with no CPU limits a pod still bursts into idle CPU.
# Memory requests stay realistic: memory is plentiful and can't be borrowed.
workloads:
  product-service:
    resources:
      requests: { cpu: 10m, memory: 128Mi }
      limits: { memory: 256Mi }
  cart-service:
    resources:
      requests: { cpu: 10m, memory: 96Mi }
      limits: { memory: 256Mi }
  order-service:
    resources:
      requests: { cpu: 5m, memory: 384Mi }
      limits: { memory: 768Mi }
  payment-service:
    resources:
      requests: { cpu: 5m, memory: 32Mi }
      limits: { memory: 128Mi }
  notification-service:
    resources:
      requests: { cpu: 5m, memory: 64Mi }
      limits: { memory: 192Mi }
  frontend:
    resources:
      requests: { cpu: 10m, memory: 128Mi }
      limits: { memory: 384Mi }
  postgres:
    resources:
      requests: { cpu: 10m, memory: 256Mi }
      limits: { memory: 512Mi }
  redis:
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { memory: 256Mi }
  mailpit:
    resources:
      requests: { cpu: 5m, memory: 32Mi }
      limits: { memory: 128Mi }

# Replace pods one at a time: stop the old pod, then start the new one. Needs
# no spare node capacity during a rollout; costs a few seconds per service.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

# Canary release for the frontend with Argo Rollouts. Off by default; prod
# turns it on. weight is the share of pods that run the new version first.
canary:
  enabled: false
  replicas: 2
  weight: 50
  checks: 4
  pause: 30s

# Traefik Ingress with an optional cert-manager certificate. Local uses it
# instead of a cloud load balancer.
ingress:
  enabled: false
  className: traefik
  host: ""
  tls:
    enabled: false
    clusterIssuer: ""

# Phase 8. ServiceMonitors, SLO rules and the Grafana dashboard need
# kube-prometheus-stack; tracing needs the OpenTelemetry Operator.
observability:
  enabled: false
  tracing: false
  otlpEndpoint: http://otel-collector.observability:4318
  sampleRatio: "1"

# Phase 9. KEDA ScaledObjects. A workload listed here is scaled by KEDA and
# its Deployment stops setting replicas.
autoscaling:
  enabled: false
  prometheusAddress: http://kube-prometheus-stack-prometheus.monitoring:9090
  workloads: {}
  # Example:
  #   product-service:
  #     trigger: prometheus
  #     min: 1
  #     max: 5
  #     query: sum(rate(http_requests_total{service="product-service"}[1m]))
  #     threshold: "20"          # requests per second per replica
  #   payment-service:
  #     trigger: servicebus      # Azure only
  #     min: 1
  #     max: 5
  #     queue: order-created
  #     messagesPerReplica: 20

# Keep a pod of each stateless service running through drains and evictions.
podDisruptionBudgets: false

# Where shopflow-secrets comes from:
#   kubernetes  created by the pipeline (deploy/k8s/create-secrets.sh)
#   keyvault    synced from Azure Key Vault by the Secrets Store CSI driver
secrets:
  provider: kubernetes
  keyVault:
    name: ""
    tenantId: ""
    clientId: ""
