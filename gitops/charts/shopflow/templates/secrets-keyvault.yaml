{{- /*
Phase 7: secrets come from Azure Key Vault instead of being created by the
pipeline. The pods' service account is federated with a user-assigned managed
identity (Workload Identity) that can only read secrets in this vault.
Terraform creates the identity, the federation and the secrets
(infra/envs/dev, keyvault_secrets_enabled).
*/}}
{{- if eq .Values.secrets.provider "keyvault" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shopflow
  labels: { environment: {{ .Values.environment | quote }}, part-of: shopflow }
  annotations:
    azure.workload.identity/client-id: {{ required "secrets.keyVault.clientId is required" .Values.secrets.keyVault.clientId | quote }}
automountServiceAccountToken: false
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: shopflow-keyvault
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.secrets.keyVault.clientId | quote }}
    keyvaultName: {{ required "secrets.keyVault.name is required" .Values.secrets.keyVault.name | quote }}
    tenantId: {{ required "secrets.keyVault.tenantId is required" .Values.secrets.keyVault.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ .Values.environment }}-postgres-password
          objectAlias: POSTGRES_PASSWORD
          objectType: secret
        - |
          objectName: {{ .Values.environment }}-servicebus-connection-string
          objectAlias: SERVICEBUS_CONNECTION_STRING
          objectType: secret
  secretObjects:
    - secretName: shopflow-secrets
      type: Opaque
      data:
        - { objectName: POSTGRES_PASSWORD, key: POSTGRES_PASSWORD }
        - { objectName: SERVICEBUS_CONNECTION_STRING, key: SERVICEBUS_CONNECTION_STRING }
{{- end }}
